{{/*
Fail fast on invalid value combinations before any resource is created.
This file renders to empty YAML when all checks pass.
*/}}
{{- if and .Values.cadence.enabled .Values.temporal.enabled -}}
{{- fail "cadence.enabled and temporal.enabled cannot both be true — pick one workflow engine per release. Set workflow.engine=cadence + cadence.enabled=true, OR workflow.engine=temporal + temporal.enabled=true. See helm/michelangelo/README.md." -}}
{{- end -}}
{{- $gcs := default dict .Values.gcsStorage -}}
{{- if and $gcs.enabled $gcs.anonymous $gcs.existingSecret -}}
{{- fail "gcsStorage.anonymous and gcsStorage.existingSecret cannot both be set — anonymous access sends no credentials, so the Secret would be unused. Unset one of them. See helm/michelangelo/README.md." -}}
{{- end -}}
{{- if and $gcs.enabled $gcs.endpoint (not $gcs.anonymous) (not (hasPrefix "https://" $gcs.endpoint)) -}}
{{- fail "gcsStorage.endpoint must start with https:// unless gcsStorage.anonymous=true — plain-http endpoints are for emulators only and must not receive credentials. See helm/michelangelo/README.md." -}}
{{- end -}}

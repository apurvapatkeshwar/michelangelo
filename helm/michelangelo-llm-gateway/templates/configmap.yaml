{{- if .Values.config.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "michelangelo-llm-gateway.configMapName" . }}
  labels:
    {{- include "michelangelo-llm-gateway.labels" . | nindent 4 }}
data:
  {{ .Values.config.key | quote }}: |
    {{- tpl (toYaml .Values.config.data) . | nindent 4 }}
{{- end }}

{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "michelangelo-llm-gateway.fullname" . }}-test-connection
  labels:
    {{- include "michelangelo-llm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: curl
      {{- if .Values.tests.image.digest }}
      image: "{{ .Values.tests.image.repository }}@{{ .Values.tests.image.digest }}"
      {{- else }}
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      {{- end }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - curl
      args:
        - --fail
        - --show-error
        - --silent
        - --max-time
        - "10"
        - http://{{ include "michelangelo-llm-gateway.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.readiness.path }}
{{- end }}

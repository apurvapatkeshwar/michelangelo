image:
  tag: v1.85.1

serviceAccount:
  name: litellm
  annotations:
    iam.gke.io/gcp-service-account: litellm@REPLACE_WITH_GCP_PROJECT.iam.gserviceaccount.com

service:
  type: LoadBalancer
  annotations:
    networking.gke.io/load-balancer-type: "Internal"

masterKey:
  existingSecret: litellm-secrets
  key: masterkey

saltKey:
  existingSecret: litellm-secrets
  key: saltkey

database:
  existingSecret: litellm-secrets
  key: database-url

environmentSecrets: []
environmentConfigMaps: []

extraEnv:
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: openai-api-key

config:
  data:
    model_list:
      - model_name: openai-default
        litellm_params:
          model: openai/REPLACE_WITH_APPROVED_OPENAI_MODEL
          api_key: os.environ/OPENAI_API_KEY
      - model_name: vertex-default
        litellm_params:
          model: vertex_ai/REPLACE_WITH_APPROVED_VERTEX_MODEL
          vertex_project: REPLACE_WITH_GCP_PROJECT
          vertex_location: REPLACE_WITH_VERTEX_LOCATION
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      disable_prisma_schema_update: true
    litellm_settings:
      cache: false
      success_callback:
        - prometheus

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

topologySpread:
  whenUnsatisfiable: DoNotSchedule

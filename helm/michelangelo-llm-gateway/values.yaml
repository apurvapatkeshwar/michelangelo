replicaCount: 2

image:
  repository: docker.io/litellm/litellm-database
  tag: v1.85.1
  digest: sha256:fb757549de0da017a597ee4b9be0bfb55c49cde77898abe789fa3ad37d770c69
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

deployment:
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

podAnnotations: {}
podLabels: {}

rollout:
  runtimeRevision: ""
  configRevision: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4000
  annotations: {}
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

config:
  create: true
  existingConfigMap: ""
  key: config.yaml
  data:
    model_list: []
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      disable_prisma_schema_update: true
    litellm_settings:
      cache: false
      success_callback:
        - prometheus

masterKey:
  existingSecret: litellm-secrets
  key: masterkey

saltKey:
  existingSecret: litellm-secrets
  key: saltkey

database:
  existingSecret: litellm-secrets
  key: database-url

environmentSecrets: []
environmentConfigMaps: []

logLevel: INFO
extraEnv: []

command: []
args:
  - --config
  - /etc/litellm/config.yaml

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

probes:
  startup:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30
  liveness:
    path: /health/liveliness
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 5
  readiness:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

terminationGracePeriodSeconds: 90
lifecycle: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

podDisruptionBudget:
  enabled: true
  minAvailable: null
  maxUnavailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  topologyKeys:
    - topology.kubernetes.io/zone
    - kubernetes.io/hostname

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

networkPolicy:
  enabled: false
  migration:
    # Migration hooks run before release resources. Set this only after a
    # matching NetworkPolicy has been provisioned outside this chart.
    managedExternally: false
  allowDNS: true
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  namespaceSelector: {}
  authorization:
    secretName: ""
    secretKey: token

migrationJob:
  enabled: true
  managedExternally: false
  useV2Resolver: true
  serviceAccountName: default
  activeDeadlineSeconds: 900
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hooks:
    helm:
      enabled: true
      weight: 0
    argocd:
      enabled: false

extraInitContainers: []
extraContainers: []
extraVolumes: []
extraVolumeMounts: []

tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.12.1
    digest: ""
    pullPolicy: IfNotPresent
